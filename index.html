<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>Vibespire</title>
  <style>
    html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; }
    #app { position: fixed; inset: 0; }
    /* Backing store is sized in device pixels by Display; CSS just fills the viewport. */
    #screen { position: absolute; inset: 0; width: 100%; height: 100%; display: block;
              image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; outline: none; }
    /* Audio-unlock gate: a transparent, full-screen, real button over the canvas. */
    #gate { position: fixed; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0; border: 0;
            background: transparent; color: transparent; cursor: pointer; font-size: 1px; }
    #gate:focus { outline: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
               clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    #fatal { position: fixed; inset: 0; margin: 0; padding: 24px; background: #0000aa; color: #fff;
             font: 14px/1.4 ui-monospace, Menlo, monospace; white-space: pre-wrap; overflow: auto; z-index: 10; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="sr-live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <pre id="fatal" hidden></pre>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
